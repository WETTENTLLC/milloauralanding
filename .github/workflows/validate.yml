name: Validate WETT Girls site
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript and production build
        run: npm run build
      - name: Lint
        run: npm run lint
